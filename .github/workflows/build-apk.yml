name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Node 22 (lo pide Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21 (lo pide Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Crear el proyecto Android (permisos, íconos y pantalla de inicio)
        run: npm run android:add

      - name: Copiar la app web al proyecto Android
        run: npm run android:sync

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: VidaMayor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
